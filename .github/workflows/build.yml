name: Build & Publish Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Gradle:
    name: Build SPBU Simulator Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass spbusimulator \
              -keypass spbusimulator \
              -dname "CN=SPBU Sim, OU=Mobile, O=SPBU Simulator, L=Jakarta, ST=ID, C=ID"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=spbusimulator" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=spbusimulator" >> "$GITHUB_ENV"
          fi

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Prepare Release APK Filename
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          SAFE_REF="${SAFE_REF:-dev}"
          APK_SRC="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          cp "$APK_SRC" "spbusimulator-${SAFE_REF}.apk"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spbusimulator-release-apk
          path: spbusimulator-*.apk

      - name: Publish Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: spbusimulator-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
